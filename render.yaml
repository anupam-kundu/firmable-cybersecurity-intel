databases:
  - name: firmable-intel-db
    databaseName: firmable_intel
    user: firmable
    plan: free

services:
  - type: web
    name: firmable-cybersecurity-intel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python pipeline/load_db.py && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: firmable-intel-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
